<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:"Noto Sans KR";src:url(../extension/fonts/NotoSansKR-subset.woff2) format("woff2");font-weight:100 900}
html,body{margin:0}body{width:440px;height:280px;background:#ffffff;display:grid;place-items:center;font-family:"Noto Sans KR",sans-serif;color:#16181d;overflow:hidden}

.l1{font-size:66px;letter-spacing:-.04em}.l2{font-size:53.8px;letter-spacing:-.07em;margin-left:-2.8px;margin-top:2px}
.t{font-size:17px;font-weight:600;color:#555b66;letter-spacing:-.02em}
</style></head><body><div class="box"><div class="logo"><span class="l1">AI이슈</span><span class="l2">따라잡기</span></div><div class="t">새 탭에서 매일 AI 트렌드</div></div></body></html>
