<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 이슈 따라잡기</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="preload" href="fonts/NotoSansKR-subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <header class="appbar">
    <a class="brand" href="#" data-home>
      <img class="logo" src="icons/icon.svg" alt="" width="32" height="32"><span class="brand-name">AI 이슈 따라잡기</span>
    </a>
    <form class="search" action="https://www.google.com/search" method="get" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input name="q" type="search" placeholder="검색하거나 주소 입력" autocomplete="off" aria-label="Google 검색">
    </form>
    <div class="actions">
      <button class="icon-btn" id="savedBtn" type="button" aria-pressed="false" title="저장한 콘텐츠" aria-label="저장한 콘텐츠">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" title="화면 모드">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="side" aria-label="카테고리">
      <ul class="cat-list" id="catList"></ul>
    </nav>

    <main class="main">
      <div class="grid" id="grid" aria-live="polite"></div>
      <p class="empty" id="empty" hidden></p>
      <p class="foot" id="foot"></p>
    </main>

    <aside class="pop" aria-labelledby="popTitle">
      <div class="pop-box">
        <div class="pop-head">
          <h2 id="popTitle"><span aria-hidden="true">🔥</span> 인기 콘텐츠</h2>
          <span class="pop-note" title="최근 48시간 동안 같은 이슈를 다룬 매체 수 기준. 조회수가 아닙니다.">여러 매체가 다룬 순</span>
        </div>
        <ol class="pop-list" id="popList"></ol>
      </div>
    </aside>
  </div>

  <template id="cardTpl">
    <article class="card">
      <a class="thumb" rel="noopener">
        <img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="">
        <span class="thumb-fallback"></span>
        <span class="read-mark" aria-label="읽음" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </span>
      </a>
      <button class="save" type="button" aria-label="저장">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>
      </button>
      <a class="title" rel="noopener"></a>
      <p class="summary"></p>
      <div class="src-line"><span class="src"></span><span class="dot">·</span><time></time></div>
      <span class="cat"></span>
    </article>
  </template>

  <script type="module" src="newtab.js"></script>
</body>
</html>
