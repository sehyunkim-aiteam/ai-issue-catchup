<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:Jua;src:url(Jua.woff2)}@font-face{font-family:BHS;src:url(BlackHanSans.woff2)}@font-face{font-family:DH;src:url(DoHyeon.woff2)}
body{margin:0;background:#FBF7EE;font-family:sans-serif;color:#262626;padding:40px}
.row{display:flex;align-items:center;gap:18px;margin:0 0 34px}.row img{width:76px;height:76px}
.w{font-size:58px;line-height:1;letter-spacing:-.01em}.lab{font:13px sans-serif;color:#888;width:120px}
.dark{background:#17181c;color:#eceef1;padding:24px;border-radius:16px;display:inline-flex}
.sizes{display:flex;gap:24px;align-items:end}.sizes img{image-rendering:auto}
</style></head><body>
<div class="row"><span class="lab">Jua</span><img src="icon.svg"><span class="w" style="font-family:Jua">AI 이슈 따라잡기</span></div>
<div class="row"><span class="lab">Black Han Sans</span><img src="icon.svg"><span class="w" style="font-family:BHS">AI 이슈 따라잡기</span></div>
<div class="row"><span class="lab">Do Hyeon</span><img src="icon.svg"><span class="w" style="font-family:DH">AI 이슈 따라잡기</span></div>
<div class="row"><span class="lab">크기별</span><div class="sizes"><img src="icon.svg" width="128" height="128"><img src="icon.svg" width="48" height="48"><img src="icon-small.svg" width="32" height="32"><img src="icon-small.svg" width="16" height="16"></div></div>
<div class="row"><span class="lab">다크 모드</span><div class="dark row" style="margin:0"><img src="icon.svg" style="width:44px;height:44px"><span class="w" style="font-family:Jua;font-size:34px">AI 이슈 따라잡기</span></div></div>
</body></html>
