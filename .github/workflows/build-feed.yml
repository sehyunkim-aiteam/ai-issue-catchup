name: build-feed

on:
  schedule:
    - cron: "17 */3 * * *"   # 3시간마다 (정각 혼잡 회피)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: ./sync-web.sh
      - run: python pipeline/build_feed.py
      - name: Commit feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "feed: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
